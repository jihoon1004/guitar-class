<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>기타 교실 — 생기초부터 마스터까지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#14110f; --surface:#1f1b18; --surface-2:#2b2521; --line:#40372f;
  --ink:#f6f0e8; --ink-dim:#b9ad9f;
  --accent:#ff8a4c; --accent-ink:#1c1108; --green:#6ddc98;
  --wood:#3a281d; --inlay:#5a4333; --fret:#a9a296; --nut:#efe6d2; --string:#dcc98f;
  --hit:rgba(255,255,255,.09); --shadow:rgba(0,0,0,.45);
  --radius:14px;
  --bad:#ff8f85; --accent-a:#ff8a4c; --accent-e:#7cc0ff; --accent-b:#8fe0a8; --sun:#ffd166;
  --art-top:#dba862; --art-edge:#8a5a2b; --art-neck:#3d2a1e; --art-metal:#d6d0c4;
  --art-e:#4f9ee6; --art-e2:#285f9c; --art-b:#cf5046; --art-b2:#7d2a25; --art-guard:#f6f0e8;
}
body[data-inst=electric]{--accent:var(--accent-e)}
body[data-inst=bass]{--accent:var(--accent-b)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,'Noto Sans KR',-apple-system,sans-serif;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}
h1{font-size:28px;line-height:1.25;letter-spacing:-.02em}
h2{font-size:21px;letter-spacing:-.01em}
h3{font-size:14px;color:var(--ink-dim);font-weight:600;margin:22px 0 10px}
.dim{color:var(--ink-dim);font-size:14px}

.top{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.seg{display:flex;flex:1;background:var(--surface);border-radius:12px;padding:3px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink-dim)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.pill{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-dim)}
.pill.on{border-color:var(--accent);color:var(--accent)}

main{max-width:760px;margin:0 auto;padding:16px 16px 100px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;min-width:0;max-width:150px;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--ink-dim)}
.nav button.on{color:var(--accent)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip small{font-size:11px;font-weight:500;color:var(--ink-dim)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on small{color:var(--accent-ink)}
.chip.sm{min-width:44px;justify-content:center;padding:0 10px}
.btn{min-height:46px;padding:0 18px;border-radius:12px;background:var(--surface-2);font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.backbar{display:block;width:100%;text-align:left;min-height:44px;padding:0 14px;margin-bottom:12px;border-radius:12px;border:1px dashed var(--accent);color:var(--accent);font-size:14px;font-weight:600}


.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transform:scaleX(var(--p))}
.lv{margin-top:26px}
.lv-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.lv-head b{font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:2px 8px}
.lv-head strong{font-size:18px}
.lv-head span{margin-left:auto;font-size:13px;color:var(--ink-dim)}
.lesson{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:56px;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.lesson i{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700;color:var(--ink-dim)}
.lesson.done i{background:var(--green);border-color:var(--green);color:var(--accent-ink)}
.lesson span{font-weight:600}
.body p{margin-top:12px}
.tips{margin:16px 0 0;padding:14px 14px 14px 32px;background:var(--surface-2);border-radius:12px;font-size:14.5px}
.tips li+li{margin-top:6px}

.board-wrap{overflow-x:auto;margin-top:12px;border-radius:10px}
.board-wrap.narrow{max-width:540px}
.board{display:block;width:100%;height:auto;user-select:none}
.board .wood{fill:var(--wood)}
.board .inlay{fill:var(--inlay)}
.board .fret{stroke:var(--fret);stroke-width:2}
.board .nut{stroke:var(--nut);stroke-width:6}
.board .str{stroke:var(--string)}
.board .str.vib{animation:vib .3s}
@keyframes vib{25%{transform:translateY(1.6px)}50%{transform:translateY(-1.6px)}75%{transform:translateY(1px)}}
.board text{font-size:11px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:var(--ink-dim)}
.board .sn{font-size:9px;font-weight:500}
.board .hit{fill:transparent;cursor:pointer}
.board .hit:hover{fill:var(--hit)}
.dot{pointer-events:none;transform-box:fill-box;transform-origin:center;transition:transform .1s}
.dot circle{fill:var(--ink)}
.dot text{fill:var(--accent-ink)}
.dot.root circle{fill:var(--accent)}
.dot.open circle{fill:none;stroke:var(--ink);stroke-width:2}
.dot.ghost circle{fill:var(--surface-2);stroke:var(--line)}
.dot.ghost text{fill:var(--ink)}
.dot.on{transform:scale(1.35)}
.dot.on circle{fill:var(--green)}
.barre{fill:var(--ink);opacity:.5}
.legend{font-size:12.5px;color:var(--ink-dim);margin-top:10px}

.slots{display:grid;gap:3px;margin-top:14px}
.slot{display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;border-radius:8px;background:var(--surface-2);min-width:0}
.slot b{font-size:20px;line-height:1.2}
.slot i{font-style:normal;font-size:11px;color:var(--ink-dim);min-height:17px}
.slot.beat i{color:var(--ink);font-weight:700}
.slot.ghost b{opacity:.22}
.slot.on{background:var(--accent);color:var(--accent-ink)}
.slot.on i{color:var(--accent-ink)}
.slot.on.ghost b{opacity:.45}
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.ctrl .step{width:44px;height:44px;border-radius:12px;background:var(--surface-2);font-size:20px;font-weight:700}
.ctrl output{min-width:74px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.ctrl input{flex:1;min-width:120px;height:44px;accent-color:var(--accent)}
.pc{min-width:48px;min-height:36px;padding:0 10px;border-radius:9px;background:var(--surface-2);font-size:14px;font-weight:700;display:inline-grid;place-items:center}
.pc.on{background:var(--accent);color:var(--accent-ink)}
.pc.sel{box-shadow:0 0 0 2px var(--accent)}
.tab.pickable{cursor:pointer}
.tab .selbg{fill:var(--hit);stroke:var(--accent);stroke-width:1.5}
.tune{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tune button{min-height:60px;border-radius:12px;background:var(--surface-2);text-align:left;padding:8px 14px}
.tune b{font-size:18px}
.tune span{display:block;font-size:12px;color:var(--ink-dim)}
.banner{display:grid;grid-template-columns:1fr 132px;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.banner div{padding:12px 0 12px 16px}
.banner b{display:block;font-size:17px}
.banner span{font-size:13px;color:var(--ink-dim)}
.pend{transform-origin:120px 100px;transform:rotate(-20deg);transition:transform .4s ease-in-out}
.pend.r{transform:rotate(20deg)}
.rank{display:flex;align-items:center;gap:12px;margin-top:6px}
.rank>svg{flex:none;width:46px;height:46px}
.rank b{display:block;font-size:17px}
.rank text,.medal text{font-size:11px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:var(--accent-ink)}
.streak{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:700;color:var(--sun);white-space:nowrap}
.streak svg{width:18px;height:18px;fill:var(--sun)}
.today{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.today button{text-align:left;padding:14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line)}
.today em{display:block;font-style:normal;font-size:12px;font-weight:700;color:var(--accent)}
.today b{display:block;margin-top:2px}
.medals{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px;margin-top:14px}
.medal{text-align:center;font-size:11.5px;color:var(--ink)}
.medal svg{display:block;width:44px;height:44px;margin:0 auto 4px}
.medal.off{opacity:.3}
.score{display:flex;gap:18px;margin-top:8px;font-size:14px;color:var(--ink-dim)}
.score b{font-size:18px;color:var(--ink)}
.quiz-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.quiz-opts .chip{justify-content:center;min-height:52px;font-size:16px}
.chip.ok{background:var(--green);border-color:var(--green);color:var(--accent-ink)}
.chip.no{background:var(--bad);border-color:var(--bad);color:var(--accent-ink)}
.confetti{position:fixed;left:50%;top:42%;z-index:9;pointer-events:none}
.confetti i{position:absolute;width:9px;height:14px;border-radius:2px;animation:pop 1.1s ease-out forwards}
@keyframes pop{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.field.half{width:calc(50% - 5px)}
.cc-live{display:flex;align-items:baseline;justify-content:space-between;margin-top:12px;color:var(--ink-dim)}
.cc-live>b{font-size:56px;line-height:1;color:var(--ink)}
.cc-live span b{color:var(--accent);font-size:18px}
.cc-tap{width:100%;min-height:96px;font-size:20px}
.ccgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ccbox{padding:8px;border-radius:12px;border:2px solid var(--line)}
.ccbox.on{border-color:var(--accent)}
.ccbox .board-wrap{margin-top:4px}
.gauge{display:block;width:100%;max-width:340px;margin:8px auto 0}
.gauge line{stroke:var(--ink-dim);stroke-width:2;stroke-linecap:round}
.gauge line.mid{stroke:var(--green);stroke-width:4}
.gauge text{font-size:11px;fill:var(--ink-dim);text-anchor:middle}
.gauge circle{fill:var(--accent)}
.gauge #needle{stroke:var(--accent);stroke-width:4;transform-origin:120px 118px;transition:transform .12s}
.gauge.ok #needle{stroke:var(--green)}
.gauge.ok circle{fill:var(--green)}
.tn{text-align:center;margin-bottom:12px}
.tn b{display:block;font-size:26px}
.tn span{font-size:13px;color:var(--ink-dim)}
.tn p{margin-top:6px;font-weight:600}
.chip.hit{border-color:var(--green);box-shadow:0 0 0 2px var(--green)}
.notice{padding:10px 14px;border-radius:12px;background:var(--surface-2);border-left:4px solid var(--sun);margin-bottom:14px;font-size:14px}
.field{display:block;width:100%;min-height:46px;padding:10px 12px;margin-top:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit}
textarea.field{min-height:150px;resize:vertical}
textarea.field.short{min-height:84px}
.acct{margin-bottom:14px}
.post-body{margin-top:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.cmt{padding:12px 0;border-top:1px solid var(--line)}
.cmt p{margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.cmt small{color:var(--ink-dim);margin-left:8px}
.link{color:var(--ink-dim);font-size:13px;text-decoration:underline;min-height:44px;padding:0 6px}
.art{display:block;width:100%;height:auto}
.logo{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800}
.logo svg{width:26px;height:26px;fill:var(--accent)}
.home{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:var(--surface)}
.home svg{width:24px;height:24px;fill:var(--accent)}
.land{max-width:1040px;margin:0 auto;padding:0 16px 56px}
.lnav{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 0}
.lnav div{display:flex;gap:8px}
.lnav .btn{padding:0 14px;font-size:14px}
.sub{display:flex;gap:4px;background:var(--surface);border-radius:12px;padding:3px;margin-bottom:14px}
.sub button{flex:1;min-height:42px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink-dim)}
.sub button.on{background:var(--surface-2);color:var(--accent)}
.sec.first{margin-top:28px}
.join{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.join p{color:var(--ink-dim);margin-top:6px}
.hero{display:grid;border-radius:20px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.hero-text{padding:24px 20px 28px}
.hero-text .eyebrow{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.06em;margin-bottom:10px}
.hero-text .lead{color:var(--ink-dim);margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(4,auto);gap:16px;justify-content:start;margin-top:24px}
.stats b{display:block;font-size:22px;line-height:1.2}
.stats span{font-size:12px;color:var(--ink-dim)}
.sec{margin-top:52px}
.sec>p{color:var(--ink-dim);margin-top:6px}
.feat,.road,.picks{display:grid;gap:12px;margin-top:18px}
.feat div{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.feat svg{width:28px;height:28px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.feat b{display:block;margin:10px 0 4px;font-size:17px}
.feat span,.road span{font-size:14px;color:var(--ink-dim)}
.road div{padding:14px 16px;border-radius:12px;background:var(--surface);border-left:4px solid var(--accent)}
.road em{font-style:normal;font-size:12px;font-weight:700;color:var(--accent)}
.road b{display:block;font-size:17px}
.pick{display:block;width:100%;text-align:left;border-radius:var(--radius);overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.pick .art{background:var(--surface-2);padding:10px 6px;max-height:84px}
.pick div{padding:10px 10px 12px;border-top:3px solid var(--c)}
.pick b{display:block;font-size:15px}
.pick span{display:none;color:var(--ink-dim);font-size:14px;margin-top:4px}
.pick em{display:block;font-style:normal;font-size:10.5px;font-weight:700;color:var(--c);margin-top:4px}
.picks{grid-template-columns:repeat(3,1fr);gap:8px}
.foot{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-dim)}
.tiles{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(132px,1fr);gap:10px;margin-top:18px;overflow-x:auto;padding:3px}
.tile{display:block;text-align:left;border-radius:12px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tile div{padding:8px 12px 10px}
.tile b{display:block;font-size:15px}
.tile span{font-size:12px;color:var(--ink-dim)}
.deco-card{position:relative;overflow:hidden}
.deco-card>*{position:relative}
.deco-card>.deco{position:absolute;right:-90px;top:-34px;width:320px;opacity:.26;transform:rotate(-14deg);pointer-events:none}
.lesson small{display:block;font-size:12.5px;font-weight:500;color:var(--ink-dim)}
.lesson.more{border-style:dashed;color:var(--accent)}
.lesson.more i{border-color:var(--accent);color:var(--accent)}
.song-hero{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.song-hero .art{border-radius:10px}
.tag{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:8px;background:var(--surface-2);font-size:12.5px;font-weight:600}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);row-gap:10px;margin-top:16px}
.tab{display:block;width:100%;height:auto}
.tab line{stroke:var(--line);stroke-width:1}
.tab text{font-size:10.5px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:var(--ink)}
.tab .cl{text-anchor:start;fill:var(--accent);font-size:10px}
.nt rect{fill:var(--surface)}
.nt.on rect{fill:var(--accent)}
.nt.on text{fill:var(--accent-ink)}
@media(min-width:700px){
  .feat{grid-template-columns:repeat(2,1fr)}
  .road{grid-template-columns:repeat(5,1fr)}
  .road div{border-left:0;border-top:4px solid var(--accent)}
  .tabs{grid-template-columns:repeat(4,1fr)}
  .hero-text{padding:36px 32px}
  .picks{gap:12px}
  .pick .art{padding:22px 18px;max-height:170px}
  .pick div{padding:16px 18px 18px}
  .pick b{font-size:20px}
  .pick span{display:block}
  .pick em{font-size:12px;margin-top:10px;letter-spacing:.08em}
}
@media(min-width:960px){
  .hero{grid-template-columns:1fr 1.1fr;align-items:center}
  .hero .art{order:2}
  .feat{grid-template-columns:repeat(4,1fr)}
  .picks{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:700px){
  h1{font-size:36px}
  .tune{grid-template-columns:repeat(3,1fr)}
  .slot b{font-size:24px}
}
</style>
</head>
<body>
<div id="app"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="pick" viewBox="0 0 24 24"><path d="M12 22C9 17.5 3.5 12.5 3.5 8.5C3.5 4.5 7 2 12 2C17 2 20.5 4.5 20.5 8.5C20.5 12.5 15 17.5 12 22Z"/></symbol>
  <symbol id="note" viewBox="0 0 20 30"><ellipse cx="7" cy="24" rx="6" ry="4.500"/><rect x="11.500" y="3" width="2" height="21"/><path d="M13 3c6 2 7 7 5 12-1-4-3-6-5-6Z"/></symbol>
  <symbol id="star" viewBox="0 0 20 20"><path d="M10 0l2.500 7.500L20 10l-7.500 2.500L10 20l-2.500-7.500L0 10l7.500-2.500Z"/></symbol>

  <symbol id="flame" viewBox="0 0 24 24"><path d="M12 2C13 6 18 8 18 14C18 18 15 21 12 21C9 21 6 18 6 14C6 11 8 10 8 7C10 8 11 9 11 11C12 9 12 6 12 2Z"/></symbol>
  <symbol id="b-chords" viewBox="0 0 240 120">
    <rect width="240" height="120" fill="var(--surface-2)"/>
    <rect x="18" y="26" width="204" height="72" rx="4" fill="var(--wood)"/>
    <rect x="18" y="26" width="6" height="72" fill="var(--nut)"/>
    <g stroke="var(--fret)" stroke-width="2"><path d="M74 26v72M124 26v72M174 26v72"/></g>
    <g stroke="var(--string)" stroke-width="1.200"><path d="M24 33H222M24 45H222M24 57H222M24 69H222M24 81H222M24 93H222"/></g>
    <circle cx="49" cy="45" r="9" fill="var(--ink)"/><circle cx="99" cy="69" r="9" fill="var(--accent-a)"/><circle cx="149" cy="81" r="9" fill="var(--accent-e)"/><circle cx="199" cy="33" r="9" fill="var(--accent-b)"/>
    <use href="#star" x="206" y="4" width="14" height="14" fill="var(--sun)"/>
  </symbol>
  <symbol id="b-scales" viewBox="0 0 240 120">
    <rect width="240" height="120" fill="var(--surface-2)"/>

  <section class="card"><h2>지판 전체</h2><p class="dim">아무 칸이나 눌러 보세요. 한 칸이 반음, 12프렛에서 개방현과 같은 이름이 다시 시작됩니다.</p>
    <div class="board-wrap">${board({lo:0, hi:12, W:50, dots, wide:true})}</div>
    <div class="btns">${chip('noteMode','natural','자연음만',state.noteMode === 'natural')}${chip('noteMode','all','모든 음',state.noteMode === 'all')}${chip('noteMode','none','이름 숨기기',state.noteMode === 'none')}</div></section>`;
}

const ICON = {
  learn:'<path d="M3 20h4v-4h4v-4h4V8h4V4"/>', chords:'<path d="M6 4v16M12 4v16M18 4v16M6 9h12M6 15h12"/>',
  rhythm:'<path d="M8 4v15m0 0-3-3m3 3 3-3M16 20V5m0 0-3 3m3-3 3 3"/>', scales:'<path d="m3 17 5-5 4 3 4-8 5 4"/>',
  tuner:'<path d="M5 18a9 9 0 1 1 14 0M12 13l4-5"/>',
  songs:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  quiz:'<path d="M8 9c0-3 2-4 4-4s4 1 4 4c0 3-4 3-4 6M12 19v.5"/>',
  board:'<path d="M4 5h16v11H10l-4 4v-4H4Z"/>',
};
function render() {
  stopAll();
  heard = pausedAt = null;
  if (state.page !== 'app' || state.tab !== 'tuner') { micStop(); micErr = ''; }
  if (cc.timer) { clearInterval(cc.timer); cc.timer = null; }
  cc.run = cc.run && cc.end > Date.now() && state.tab === 'chords' && state.cview === 'change' && !cc.done;
  // 게시판은 악기를 고르지 않아도 볼 수 있다
  const landing = state.page === 'landing' || (!state.inst && state.tab !== 'board');
  document.body.dataset.inst = landing ? '' : state.inst || '';
  if (landing) return $('#app').innerHTML = viewLanding();
  // 하단 메뉴는 다섯 개로 줄이고, 연습 도구 네 가지는 '연습' 안에서 고른다
  const inPractice = PRACTICE.includes(state.tab);
  if (inPractice) state.practice = state.tab;
  const tabs = [['learn','레슨','learn'], ['songs','곡','songs'], [state.practice,'연습','chords'], ['tuner','튜닝','tuner'], ['board','게시판','board']];
  const ptools = [['chords', bass() ? '코드톤' : '코드'], ['rhythm', bass() ? '리듬' : '스트로크'], ['scales','스케일'], ['quiz','퀴즈']];
  const sub = inPractice ? `<div class="sub">${ptools.map(([k,l]) => `<button data-act="tab" data-v="${k}" class="${k === state.tab ? 'on' : ''}">${l}</button>`).join('')}</div>` : '';
  const view = state.tab === 'learn' ? (state.lesson ? viewLesson() : viewLearn())
    : state.tab === 'songs' ? (state.song ? viewSong() : viewSongs())
    : state.tab === 'quiz' ? viewQuiz() : state.tab === 'board' ? viewBoard()
    : state.tab === 'chords' ? (bass() ? viewMap('tone') : viewChords())
    : state.tab === 'rhythm' ? viewRhythm() : state.tab === 'scales' ? viewMap('scale') : viewTuner();
  $('#app').innerHTML = `<header class="top"><button class="home" data-act="home" aria-label="처음 화면으로">${LOGO}</button><div class="seg">${Object.entries(INST).map(([k,v]) => `<button data-act="inst" data-v="${k}" class="${k === state.inst ? 'on' : ''}">${v.n}</button>`).join('')}</div>
    ${state.inst === 'electric' ? `<button class="pill ${state.drive ? 'on' : ''}" data-act="drive">드라이브</button>` : ''}</header>
  <main>${state.back ? `<button class="backbar" data-act="return">‹ ${state.back.song ? '곡으로' : '레슨으로'} 돌아가기</button>` : ''}${sub}${view}</main>
  <nav class="nav">${tabs.map(([k,l,ic]) => `<button data-act="tab" data-v="${k}" class="${k === state.tab ? 'on' : ''}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[ic]}</svg>${l}</button>`).join('')}</nav>`;
}
function setBpm(n) {
  state.bpm = Math.min(200, Math.max(30, n));
  $('#bpm').textContent = state.bpm + ' BPM'; $('#bpmr').value = state.bpm; save();
}
const top0 = () => scrollTo(0,0);
const ACT = {
  start() { $('#pick').scrollIntoView({behavior:'smooth'}); },
  mic() { if (mic) { micStop(); render(); } else micStart(); },
  tstr(v) { micLock = v === 'auto' ? null : +v; render(); },
  resume() { state.page = 'app'; render(); top0(); },
  home() { state.page = 'landing'; render(); top0(); },
  community() { state.page = 'app'; ACT.tab('board'); },
  join() { cm.go = true; cm.signup = true; cm.msg = ''; cm.view = 'auth'; state.page = 'app'; state.tab = 'board'; state.lesson = state.song = state.back = null; render(); top0(); },
  // 첫 화면에서 가입·로그인하러 온 사람은 끝나면 악기 선택이나 레슨으로 보낸다
  afterAuth() {
    if (!cm.go) { cm.view = 'list'; return loadPosts(); }
    cm.go = false; cm.view = 'list';
    if (state.inst) { state.tab = 'learn'; render(); return top0(); }
    state.tab = 'learn'; state.page = 'landing'; cm.pick = true; render(); top0();
    // 프로필을 불러온 뒤 loadMe 가 악기 선택으로 내려 준다. 늦어도 1.5초 뒤에는 내려간다.
    setTimeout(() => { if (cm.pick) { cm.pick = false; if (state.page === 'landing') ACT.start(); } }, 1500);
  },
  inst(v) { if (!state.inst && state.tab === 'board') state.tab = 'learn'; state.page = 'app'; state.inst = v; state.lesson = state.back = null; state.quiz.q = null; micLock = null; if (state.song) songPreset(); voicing(); save(); render(); top0(); },
  tab(v) {
    // 악기를 아직 고르지 않았으면 악기 선택으로 보낸다. 고르고 나면 누른 메뉴가 열린다.
    if (!state.inst && v !== 'board') { state.tab = v; state.page = 'landing'; render(); return ACT.start(); }
    state.tab = v; state.lesson = state.song = state.back = null; resetLoop(); if (v === 'board' && sb) { cm.view = 'list'; cm.msg = ''; loadPosts(); } render(); top0();
  },
  bview(v) { cm.req++; cm.view = v; cm.msg = ''; cm.go = false; if (v === 'list') loadPosts(); if (v === 'admin') loadMembers(); render(); top0(); },
  bcat(v) { cm.cat = v; cm.msg = ''; loadPosts(); },
  bmore() { loadPosts(true); },
  bmode() { cm.signup = !cm.signup; render(); },
  bwrite() { cm.edit = null; cm.msg = ''; cm.view = cm.me ? 'write' : 'auth'; render(); top0(); },
  bedit() { cm.edit = cm.post; cm.view = 'write'; render(); top0(); },
  async bopen(v) {
    cm.msg = '';
    // 응답을 기다리는 사이 다른 화면으로 옮겼으면 늦게 온 결과로 화면을 되돌리지 않는다
    const req = ++cm.req;
    const [p, c] = await Promise.all([sb.from('posts').select('*,profiles(nickname)').eq('id', v).single(),
      sb.from('comments').select('id,body,created_at,author,profiles(nickname)').eq('post_id', v).order('created_at')]);
    if (req !== cm.req) return;
    if (p.error || c.error) cm.msg = errText(p.error || c.error);
    else { cm.post = p.data; cm.comments = c.data; cm.view = 'post'; }
    boardRender();
  },
  async bsave() {
    const row = {category:$('#wcat').value, title:$('#wtitle').value.trim(), body:$('#wbody').value.trim()};
    if (!row.title || !row.body) return say('제목과 내용을 모두 적어 주세요.');
    const {error} = await (cm.edit ? sb.from('posts').update({...row, updated_at:new Date().toISOString()}).eq('id', cm.edit.id) : sb.from('posts').insert(row));
    if (error) return say(errText(error));
    if (cm.edit) return ACT.bopen(cm.edit.id);
    cm.view = 'list'; loadPosts();
  },
  async bdel() {
    if (!confirm('이 글을 삭제할까요? 댓글도 함께 지워집니다.')) return;
    const {error} = await sb.from('posts').delete().eq('id', cm.post.id);
    if (error) return say(errText(error));
    cm.view = 'list'; loadPosts();
  },
  async bpin() {
    const req = cm.req, {error} = await sb.from('posts').update({pinned:!cm.post.pinned}).eq('id', cm.post.id);
    if (error) say(errText(error)); else if (req === cm.req) ACT.bopen(cm.post.id);
  },
  async csave() {
    const body = $('#cbody').value.trim();
    if (!body) return say('댓글 내용을 적어 주세요.');
    const req = cm.req, {error} = await sb.from('comments').insert({post_id:cm.post.id, body});
    if (error) say(errText(error)); else if (req === cm.req) ACT.bopen(cm.post.id);
  },
  async cdel(v) {
    if (!confirm('이 댓글을 삭제할까요?')) return;
    const req = cm.req, {error} = await sb.from('comments').delete().eq('id', v);
    if (error) say(errText(error)); else if (req === cm.req) ACT.bopen(cm.post.id);
  },
  async blogin() {
    const {error} = await sb.auth.signInWithPassword({email:$('#aemail').value.trim(), password:$('#apass').value});
    if (error) return say(errText(error));
    ACT.afterAuth();
  },
  async bsignup() {
    const nickname = $('#anick').value.trim(), password = $('#apass').value;
    if (nickname.length < 2) return say('닉네임은 2자 이상으로 적어 주세요.');
    if (password.length < 6) return say('비밀번호는 6자 이상이어야 합니다.');
    const {data, error} = await sb.auth.signUp({email:$('#aemail').value.trim(), password, options:{data:{nickname}}});
    if (error) return say(errText(error));
    if (!data.session) return say('가입 확인 메일을 보냈습니다. 메일의 링크를 누르면 가입이 끝나고 이 사이트로 돌아옵니다.');
    ACT.afterAuth();
  },
  async blogout() { await sb.auth.signOut(); cm.me = cm.user = null; cm.view = 'list'; render(); },
  async ssave(v) {
    const value = $('#s-'+v).value.trim(), {error} = await sb.from('settings').update({value}).eq('key', v);
    if (error) return say(errText(error));
    site[v] = value; say('저장했습니다. 이용자 화면에는 새로 열 때부터 반영됩니다.');
  },
  async mban(v) {
    const m = cm.members.find(x => x.id === v), {error} = await sb.rpc('admin_set_banned', {target:v, flag:!m.banned});
    error ? say(errText(error)) : loadMembers();
  },
  lesson(v) { state.lesson = v; render(); top0(); },
  back() { state.lesson = null; render(); },
  return() { Object.assign(state, {lesson:null, song:null}, state.back, {back:null}); render(); top0(); },
  songs() { state.song = null; resetLoop(); render(); },
  song(v) { state.song = v; state.tr = state.capo = 0; resetLoop(); songPreset(); render(); top0(); },
  speed(v) { setBpm(Math.round(curSong().bpm * v)); },
  loop() { const on = !state.loop.on; resetLoop(); state.loop.on = on; render(); },
  lup(v, el) { state.loop.up = !state.loop.up; el.classList.toggle('on'); },
  lbar(v) {
    const L = state.loop, bar = +v;
    if (!L.on) return;
    if (L.a == null || L.b != null) { L.a = bar; L.b = null; } else { const lo = Math.min(L.a, bar); L.b = Math.max(L.a, bar); L.a = lo; }
    render();
  },
  scat(v) { state.scat = state.scat === v ? 'all' : v; render(); },
  slv(v) { state.slv = +v; render(); },
  lvsongs(v) { Object.assign(state, {tab:'songs', song:null, lesson:null, scat:'all', slv:+v}); render(); top0(); },
  needch(v) { const s = curSong(); Object.assign(state, {back:{tab:'songs', song:s.id}, tab:'chords', cat:'레슨', chord:v, list:shownChords(s)}); render(); top0(); },
  acc(v, el) { state.acc = !state.acc; el.classList.toggle('on'); },
  done(v) { const d = state.done[state.inst], i = d.indexOf(v); i < 0 ? (d.push(v), party()) : d.splice(i,1); save(); render(); },
  sdone(v) { const d = state.songDone, i = d.indexOf(v); i < 0 ? (d.push(v), party()) : d.splice(i,1); save(); render(); },
  qmode(v) { Object.assign(state.quiz, {mode:v, score:0, run:0}); newQ(); render(); if (v === 'ear') playQ(); },
  qnext() { newQ(); render(); if (state.quiz.mode === 'ear') playQ(); },
  qplay() { playQ(); },
  answer(v) {
    const z = state.quiz;
    if (z.pick != null) return;
    z.pick = v;
    if (v === z.q.ans) { z.score++; z.run++; state.best[z.mode] = Math.max(state.best[z.mode], z.run); if (z.run % 5 === 0) party(); } else z.run = 0;
    save(); render(); playQ();
  },
  go(v) { const g = lessons().find(l => l.id === state.lesson).go[v]; Object.assign(state, g.set, {tab:g.tab, back:{tab:'learn', lesson:state.lesson}, lesson:null}); save(); render(); top0(); },
  chord(v) { state.chord = v; render(); strum(chordOf(v).fr, 'D'); },
  cview(v) { state.cview = v; render(); },
  ccpair(v) { [cc.a, cc.b] = v.split('|'); cc.done = false; render(); },
  ccstart() {
    Object.assign(cc, {count:0, run:true, done:false, end:Date.now() + 60000});
    render();
    cc.timer = setInterval(() => {
      const left = cc.end - Date.now();
      if (left > 0) { $('#cc-time').textContent = Math.ceil(left/1000) + '초'; $('#cc-bar').style.setProperty('--p', left/60000); return; }
      const key = [cc.a, cc.b].sort().join('|'), record = cc.count > (state.ccBest[key] || 0);
      if (record) { state.ccBest[key] = cc.count; save(); party(); }
      Object.assign(cc, {done:true, record});
      render();
    }, 100);
  },
  cctap() {
    if (!cc.run) return;
    cc.count++;
    tick(ac().currentTime, false);
    $('#cc-count').textContent = cc.count;
    const next = cc.count % 2 ? cc.a : cc.b;
    $('#cc-next').textContent = next;
    document.querySelectorAll('.ccbox').forEach(el => el.classList.toggle('on', el.dataset.n === next));
  },
  tr(v) { state.tr = Math.max(-6, Math.min(6, state.tr + +v)); render(); },
  capo(v) { state.capo = Math.max(0, Math.min(9, state.capo + +v)); render(); },
  trreset() { state.tr = state.capo = 0; render(); },
  cat(v) { state.cat = v; render(); },
  strum(v) { const fr = chordOf(state.chord).fr; v === 'A' ? playSeq(fr.map((f,s) => [s,f]).filter(x => x[1] >= 0), 320) : strum(fr, v); },
  pluck(v, el) { pluck(+el.dataset.s, +el.dataset.f); vib(el.dataset.s); },
  pat(v) { state.pat = v; render(); },
  prog(v) { state.prog = v; resetLoop(); render(); },
  play() {
    if (player) { stopAll(); pausedAt = heard; setBtns(); return; }
    const from = pausedAt;
    pausedAt = null;
    state.tab === 'songs' && curSong().m ? startMelody(from) : startPlay(from);
  },
  stop() {
    stopAll(); heard = pausedAt = null; setBtns();
    document.querySelectorAll('.slot.on, .nt.on').forEach(e => e.classList.remove('on'));
  },
  bpm(v) { setBpm(state.bpm + +v); },
  click(v, el) { state.click = !state.click; el.classList.toggle('on'); },
  scale(v) { state.scale = v; render(); },
  tset(v) { state.tset = v; render(); },
  root(v) { state.root = +v; render(); },
  label(v) { state.label = v; render(); },
  noteMode(v) { state.noteMode = v; render(); },
  playmap(v) {
    const iv = (v === 'tone' ? TONES.find(x => x[0] === state.tset) : SCALES.find(x => x[0] === state.scale))[3], t = T();
    const base = t[0] + (state.root - t[0]%12 + 12)%12, up = [];
    for (let o = 0; o < (bass() ? 1 : 2); o++) iv.forEach(d => up.push(base + o*12 + d));
    up.push(base + (bass() ? 12 : 24));
    playSeq([...up, ...up.slice(0,-1).reverse()].map(m => { const p = posFor(m, base - t[0]); return [p.s, p.f]; }), 260);
  },
  open(v) { pluck(+v, 0); vib(v); },
  openall() { playSeq(T().map((m,s) => [s,0]), 700); },
  drive(v, el) { state.drive = !state.drive; el.classList.toggle('on'); voicing(); },
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el) ACT[el.dataset.act](el.dataset.v, el); });
document.addEventListener('change', e => {
  if (e.target.id === 'cc-a' || e.target.id === 'cc-b') { cc[e.target.id.slice(3)] = e.target.value; cc.done = false; render(); }
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && cc.run) { e.preventDefault(); return ACT.cctap(); }
  if (e.code !== 'Space' || !$('#playbtn') || e.target.closest('button, input, textarea, select')) return;
  e.preventDefault(); ACT.play();
});
document.addEventListener('input', e => { if (e.target.id === 'bpmr') setBpm(+e.target.value); });
render();
initCloud();
</script>
